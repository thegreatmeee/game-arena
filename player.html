<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Game - Arcade Zone</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #000; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .nav-bar { width: 100%; background: #111; padding: 15px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: #ff3e6c; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .game-container { flex-grow: 1; width: 100%; max-width: 1024px; max-height: 768px; margin: 20px 0; box-shadow: 0 0 20px rgba(255, 62, 108, 0.3); }
        iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">⬅ Back to Arcade</a>
        <span>Arcade Premium Player</span>
    </div>

    <div class="game-container">
        <iframe id="arcade-frame" src="" allowfullscreen></iframe>
    </div>

    <script>
        // Extract the game URL from the browser's address parameter string
        const urlParams = new URLSearchParams(window.location.search);
        const gameUrl = urlParams.get('game');
        
        if (gameUrl) {
            document.getElementById('arcade-frame').src = gameUrl;
        } else {
            document.body.innerHTML = "<h1>Error: No game selected!</h1><br><a href='index.html' style='color:white;'>Go Back</a>";
        }
    </script>

</body>
</html>
